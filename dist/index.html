<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Punishments</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<div class="logo">🛡 Discord Punishments</div>

<input id="search" placeholder="Hledat hráče...">
</nav>

<div class="stats">

<div class="card">
<h2 id="warns">0</h2>
<span>Warny</span>
</div>

<div class="card">
<h2 id="mutes">0</h2>
<span>Muty</span>
</div>

<div class="card">
<h2 id="bans">0</h2>
<span>Bany</span>
</div>

<div class="card">
<h2 id="kicks">0</h2>
<span>Kicky</span>
</div>

</div>

<table>

<thead>
<tr>
<th>Discord ID</th>
<th>Hráč</th>
<th>Trest</th>
<th>Důvod</th>
<th>Moderátor</th>
<th>Datum</th>
</tr>
</thead>

<tbody id="tbody">

</tbody>

</table>

<script src="script.js"></script>

</body>
</html>
